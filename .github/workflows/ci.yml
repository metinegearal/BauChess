name: Checks
on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-airflow.txt --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.1.0/constraints-3.12.txt
      - run: pip install -r requirements.txt apache-airflow==3.1.0
      - run: pip check
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q config.py BasicOllama.py ChessTools.py DataProcess.py DataStorage.py ScrapChessData.py StockFishReview.py FrontEnd.py BackEnd Dags
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: my-app/package-lock.json
      - run: npm ci
      - run: npm run check
